version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: "/.github/tooling/fpm"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ci-bundler-dependencies:
        patterns: ["*"]
